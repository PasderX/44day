<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>44day_</title>
  <meta name="description" content="44day — hub for cracks, scripts, tools, cybersec, free internet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hub.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0a0a'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='14' font-weight='700' text-anchor='middle' fill='%2300ff66'%3E44%3C/text%3E%3C/svg%3E">
</head>
<body>

  <!-- ============ TOPBAR ============ -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand" title="home">
        <span class="b-prompt">44day</span><span class="b-cursor">_</span>
      </a>

      <div class="topbar-spacer"></div>

      <button id="search-trigger" class="search-trigger" aria-label="search">
        <svg class="st-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="st-text" id="st-text">search</span>
        <kbd>Ctrl K</kbd>
      </button>

      <div id="music-player-mount"></div>

      <div class="theme-switch" title="theme">
        <button class="theme-btn is-active" data-theme="dark" aria-label="dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="theme-btn" data-theme="light" aria-label="light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </div>

      <div id="lang-switch"></div>

      <a href="/admin" class="icon-btn" title="admin" aria-label="admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-1.5a7 7 0 0 1 14 0V21"/></svg>
      </a>
    </div>
  </header>

  <!-- ============ MAIN ============ -->
  <main class="main">

    <!-- prompt line -->
    <p class="prompt-line">
      <span class="p-host">44day:~$</span>
      <span class="p-cmd" id="prompt-cmd">ls categories/</span>
    </p>

    <!-- categories as rows -->
    <h2 class="section-h" data-i18n="home.categories">categories</h2>
    <ul class="cat-list" id="cat-list">
      <li class="skeleton-row"></li>
      <li class="skeleton-row"></li>
      <li class="skeleton-row"></li>
      <li class="skeleton-row"></li>
    </ul>

    <!-- recent items -->
    <h2 class="section-h" data-i18n="home.recent">recent</h2>
    <ul class="item-list" id="recent-list">
      <li class="skeleton-row"></li>
      <li class="skeleton-row"></li>
      <li class="skeleton-row"></li>
    </ul>

  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <div class="footer-inner">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <span>© 2026 <strong style="color:var(--text-dim)">44day team</strong></span>
        <a href="https://t.me/baku_root" target="_blank" rel="noopener" class="tg-foot">
          <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
          <span>Telegram · @baku_root</span>
        </a>
      </div>
      <div class="dim">
        <span>v2.0</span>
        <span> · </span>
        <a href="/whoami">whoami</a>
        <span> · </span>
        <a href="/admin">admin</a>
      </div>
    </div>
  </footer>

  <button id="scroll-top" title="↑">↑</button>
  <div id="toast-stack" class="toast-stack"></div>

  <!-- ============ SCRIPTS ============ -->
  <script src="hub-i18n.js"></script>
  <script src="favs.js"></script>
  <script src="cmd.js"></script>
  <script src="hub.js"></script>
  <script src="music.js"></script>
  <script src="sudo.js"></script>
  <script src="online.js"></script>
  <script src="ui.js"></script>
</body>
</html>
