<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>admin — 44day_</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hub.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <span class="b-prompt">44day</span><span class="b-cursor">_</span>
        <span class="b-path mono dim" style="margin-left:10px;font-size:12px">/admin</span>
      </a>
      <div class="topbar-spacer"></div>
      <div class="theme-switch">
        <button class="theme-btn is-active" data-theme="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        <button class="theme-btn" data-theme="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
      </div>
      <a href="/" class="nav-link" title="на сайт">← site</a>
    </div>
  </header>

  <main class="admin-shell">

    <!-- ============ LOGIN ============ -->
    <section id="login">
      <div class="admin-login">
        <h1>ADMIN</h1>
        <input id="login-pass" type="password" placeholder="пароль..." autocomplete="off"/>
        <div id="login-error" class="admin-error"></div>
        <button id="login-btn" class="btn-primary">войти</button>
      </div>
    </section>

    <!-- ============ DASHBOARD ============ -->
    <section id="dashboard" style="display:none">

      <p class="prompt-line">
        <span class="p-host">44day:~$</span>
        <span class="p-cmd">sudo manage</span>
        <span class="p-cursor"></span>
      </p>

      <!-- TABS -->
      <nav class="admin-tabs">
        <button class="ad-tab active" data-tab="items">записи</button>
        <button class="ad-tab" data-tab="categories">категории</button>
        <button class="ad-tab" data-tab="config">настройки</button>
        <button class="ad-tab" data-tab="stats">статистика</button>
        <div class="ad-tabs-spacer"></div>
        <button id="logout-btn" class="btn-ghost">выход</button>
      </nav>

      <!-- =========== TAB: ITEMS =========== -->
      <div class="ad-panel active" data-panel="items">
        <div class="admin-toolbar">
          <h2>записи каталога</h2>
          <div class="right">
            <button id="add-btn" class="btn-primary">+ добавить</button>
          </div>
        </div>

        <div id="form-wrap" class="admin-form" style="display:none">
          <h3 id="form-title">новая запись</h3>
          <div class="grid">
            <div>
              <label>тип</label>
              <select id="f-type">
                <option value="software">программа / crack / config</option>
                <option value="article">статья</option>
              </select>
            </div>
            <div>
              <label>категория</label>
              <select id="f-category"></select>
            </div>
            <div>
              <label>подкатегория (id)</label>
              <input id="f-subcategory" type="text" placeholder="tunnels / vpn / azercell ..."/>
            </div>
            <div>
              <label>оператор(ы)</label>
              <input id="f-operator" type="text" placeholder="bakcell, azercell, nar — через запятую"/>
            </div>
            <div>
              <label>иконка (emoji)</label>
              <input id="f-icon" type="text" placeholder="🛰" maxlength="4"/>
            </div>
            <div>
              <label>название (ru)</label>
              <input id="f-name" type="text"/>
            </div>
            <div>
              <label>название (az)</label>
              <input id="f-name-az" type="text" placeholder="Azərbaycan dilində..."/>
            </div>
            <div class="row-software">
              <label>версия</label>
              <input id="f-version" type="text" placeholder="1.0.0"/>
            </div>
            <div class="row-software">
              <label>размер</label>
              <input id="f-size" type="text" placeholder="120 MB"/>
            </div>
            <div class="row-software">
              <label>рейтинг (0-5)</label>
              <input id="f-rating" type="number" step="0.1" min="0" max="5"/>
            </div>
            <div class="row-software">
              <label>статус (working / dead / unknown)</label>
              <input id="f-status" type="text" placeholder="working"/>
            </div>
            <div class="row-software">
              <label>формат (.ehi / .hat / ...)</label>
              <input id="f-format" type="text" placeholder=".ehi"/>
            </div>
            <div class="row-software">
              <label>провайдер (Azercell / Bakcell / Nar)</label>
              <input id="f-provider" type="text"/>
            </div>
            <div class="full row-software">
              <label>оригинал — ссылка (Google Play / GitHub / official site)</label>
              <input id="f-url" type="text" placeholder="https://play.google.com/..."/>
            </div>
            <div class="full row-software">
              <label>mod-версия — прямая ссылка на APK / архив</label>
              <input id="f-mod" type="text" placeholder="https://..."/>
            </div>
            <div class="row-article" style="display:none">
              <label>время чтения</label>
              <input id="f-reading" type="text" placeholder="5 мин"/>
            </div>
            <div class="full">
              <label>тэги (через запятую)</label>
              <input id="f-tags" type="text" placeholder="vpn, free, opensource"/>
            </div>
            <div class="full">
              <label>описание (ru)</label>
              <textarea id="f-desc" rows="2"></textarea>
            </div>
            <div class="full">
              <label>описание (az)</label>
              <textarea id="f-desc-az" rows="2" placeholder="Qısa təsvir..."></textarea>
            </div>
            <div class="full row-article" style="display:none">
              <label>содержание (ru) — markdown</label>
              <textarea id="f-content" rows="10"></textarea>
            </div>
            <div class="full row-article" style="display:none">
              <label>содержание (az) — markdown</label>
              <textarea id="f-content-az" rows="10"></textarea>
            </div>
          </div>
          <div class="actions">
            <button id="save-btn" class="btn-primary">сохранить</button>
            <button id="cancel-btn" class="btn-ghost">отмена</button>
          </div>
        </div>

        <div class="admin-toolbar">
          <input id="filter-cat" placeholder="фильтр по названию..."/>
          <select id="filter-by-cat"><option value="">все категории</option></select>
        </div>

        <table class="admin-table">
          <thead>
            <tr><th>#</th><th>название</th><th>категория</th><th>тип</th><th>↓</th><th>★</th><th></th></tr>
          </thead>
          <tbody id="items-body"></tbody>
        </table>
      </div>

      <!-- =========== TAB: CATEGORIES =========== -->
      <div class="ad-panel" data-panel="categories">
        <div class="admin-toolbar">
          <h2>категории</h2>
          <div class="right">
            <button id="add-cat-btn" class="btn-primary">+ добавить категорию</button>
          </div>
        </div>

        <div id="cat-form-wrap" class="admin-form" style="display:none">
          <h3 id="cat-form-title">новая категория</h3>
          <div class="grid">
            <div>
              <label>id (slug, латиница)</label>
              <input id="cf-id" type="text" placeholder="security"/>
            </div>
            <div>
              <label>иконка (emoji)</label>
              <input id="cf-icon" type="text" placeholder="🛡" maxlength="4"/>
            </div>
            <div>
              <label>цвет</label>
              <input id="cf-color" type="color" value="#4ade80"/>
            </div>
            <div>
              <label>external url (для ссылки наружу)</label>
              <input id="cf-external" type="text" placeholder="(оставь пустым)"/>
            </div>
            <div>
              <label>название (ru)</label>
              <input id="cf-name" type="text"/>
            </div>
            <div>
              <label>название (az)</label>
              <input id="cf-name-az" type="text"/>
            </div>
            <div class="full">
              <label>описание (ru)</label>
              <input id="cf-desc" type="text"/>
            </div>
            <div class="full">
              <label>описание (az)</label>
              <input id="cf-desc-az" type="text"/>
            </div>
          </div>
          <div class="actions">
            <button id="cat-save-btn" class="btn-primary">сохранить</button>
            <button id="cat-cancel-btn" class="btn-ghost">отмена</button>
          </div>
        </div>

        <table class="admin-table">
          <thead><tr><th>иконка</th><th>id</th><th>название</th><th>цвет</th><th>записей</th><th></th></tr></thead>
          <tbody id="cats-body"></tbody>
        </table>
      </div>

      <!-- =========== TAB: CONFIG =========== -->
      <div class="ad-panel" data-panel="config">
        <div class="admin-toolbar"><h2>настройки сайта</h2></div>
        <div class="admin-form" style="display:block">
          <div class="grid">
            <div>
              <label>имя сайта</label>
              <input id="cfg-siteName" type="text"/>
            </div>
            <div>
              <label>цвет акцента</label>
              <input id="cfg-accent" type="color" value="#4ade80"/>
            </div>
            <div>
              <label>тема по умолчанию</label>
              <select id="cfg-theme"><option value="dark">Dark</option><option value="light">Light</option></select>
            </div>
            <div>
              <label>язык по умолчанию</label>
              <select id="cfg-lang"><option value="ru">RU</option><option value="az">AZ</option></select>
            </div>
            <div class="full">
              <label>сменить пароль (оставь пустым чтобы не менять)</label>
              <input id="cfg-password" type="password" placeholder="новый пароль"/>
            </div>
          </div>
          <div class="actions">
            <button id="cfg-save-btn" class="btn-primary">сохранить</button>
          </div>
        </div>
      </div>

      <!-- =========== TAB: STATS =========== -->
      <div class="ad-panel" data-panel="stats">
        <div class="admin-toolbar"><h2>статистика</h2></div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-num" id="stat-items">—</div><div class="stat-lbl">записей</div></div>
          <div class="stat-card"><div class="stat-num" id="stat-soft">—</div><div class="stat-lbl">программ</div></div>
          <div class="stat-card"><div class="stat-num" id="stat-art">—</div><div class="stat-lbl">статей</div></div>
          <div class="stat-card"><div class="stat-num" id="stat-dl">—</div><div class="stat-lbl">скачиваний</div></div>
        </div>
        <div class="stats-block">
          <h3>активность за 14 дней</h3>
          <div id="stat-timeline" class="timeline"></div>
        </div>
        <div class="stats-block">
          <h3>топ-10 по скачиваниям</h3>
          <table class="admin-table"><thead><tr><th>#</th><th>название</th><th>тип</th><th>↓</th></tr></thead><tbody id="stat-top"></tbody></table>
        </div>
      </div>

    </section>
  </main>

  <div id="toast-stack" class="toast-stack"></div>

  <script src="ui.js"></script>
  <script src="admin.js"></script>
</body>
</html>
