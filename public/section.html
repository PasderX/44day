<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/" />
  <title>44day_</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hub.css?v=2605061000" />
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand"><span class="b-prompt">44day</span><span class="b-cursor">_</span></a>
      <div class="topbar-spacer"></div>
      <button id="search-trigger" class="search-trigger">
        <svg class="st-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="st-text" id="st-text">search</span>
        <kbd>Ctrl K</kbd>
      </button>
      <div id="music-player-mount"></div>
      <div class="theme-switch">
        <button class="theme-btn is-active" data-theme="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        <button class="theme-btn" data-theme="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
      </div>
      <div id="lang-switch"></div>
      <a href="/admin" class="icon-btn" title="admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-1.5a7 7 0 0 1 14 0V21"/></svg></a>
    </div>
  </header>

  <main class="main">
    <p class="prompt-line">
      <span class="p-host">44day:~$</span>
      <span class="p-cmd" id="prompt-cmd">cd / &amp;&amp; ls</span>
    </p>

    <!-- section header -->
    <div class="sec-head" id="sec-head">
      <div class="sh-icon" id="sh-icon">·</div>
      <div class="sh-meta">
        <h1 id="sh-title">—</h1>
        <p id="sh-desc">loading...</p>
      </div>
      <div class="sh-stats">
        <span><strong id="sh-count">0</strong> <span data-i18n="sec.itemsCount">записей</span></span>
        <span><strong id="sh-dl">0</strong> <span data-i18n="sec.totalDl">скачиваний</span></span>
      </div>
    </div>

    <!-- subcategory chips -->
    <div class="chips" id="chips"></div>

    <!-- controls -->
    <div class="sec-controls">
      <input id="sec-search" class="input" placeholder="поиск..." data-i18n-attr="placeholder:sec.search"/>
      <select id="sec-sort" class="select">
        <option value="popular" data-i18n="sec.sortPopular">по популярности</option>
        <option value="new" data-i18n="sec.sortNew">по дате</option>
        <option value="rating" data-i18n="sec.sortRating">по рейтингу</option>
        <option value="az" data-i18n="sec.sortAZ">по алфавиту</option>
      </select>
    </div>

    <!-- items -->
    <ul class="item-list" id="sec-grid">
      <li class="skeleton-row"></li><li class="skeleton-row"></li><li class="skeleton-row"></li>
    </ul>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <span>© 2026 <strong style="color:var(--text-dim)">44day team</strong></span>
        <a href="https://t.me/baku_root" target="_blank" rel="noopener" class="tg-foot">
          <svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg>
          <span>Telegram · @baku_root</span>
        </a>
      </div>
      <div class="dim"><a href="/">home</a></div>
    </div>
  </footer>

  <button id="scroll-top" title="↑">↑</button>
  <div id="toast-stack" class="toast-stack"></div>

  <script src="hub-i18n.js?v=2605061000"></script>
  <script src="tooltip.js?v=2605061000"></script>
  <script src="icons.js?v=2605061000"></script>
  <script src="favs.js?v=2605061000"></script>
  <script src="cmd.js?v=2605061000"></script>
  <script src="section.js?v=2605061000"></script>
  <script src="music.js?v=2605061000"></script>
  <script src="sudo.js?v=2605061000"></script>
  <script src="online.js?v=2605061000"></script>
  <script src="ui.js?v=2605061000"></script>
</body>
</html>
